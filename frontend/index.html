<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crypto Calculator</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>Crypto Calculator</h1>
  <p class="subtitle">Purchase averages, holdings, and the buy-to-target-average tool. All figures in EUR.</p>
</header>

<main>
  <section id="upload-section" class="card">
    <h2>Import transactions</h2>
    <form id="upload-form">
      <label>
        Exchange
        <select name="exchange" id="exchange-select">
          <option value="binance">Binance (Spot Order History CSV)</option>
          <option value="binance_fills">Binance (Spot Trade History CSV, with Fee column)</option>
          <option value="coinbase">Coinbase (Transaction History CSV)</option>
        </select>
      </label>
      <label>
        File
        <input type="file" name="file" id="file-input" accept=".csv,.xlsx" required>
      </label>
      <button type="submit">Upload &amp; import</button>
    </form>
    <div id="upload-result"></div>
  </section>

  <section id="settings-section" class="card">
    <details>
      <summary><h2 style="display:inline">Settings</h2></summary>
      <div class="settings-body">
        <label>
          Dashboard shows only these assets (comma-separated; leave empty to show everything)
          <input type="text" id="tracked-symbols-input" placeholder="e.g. BTC, AVAX, XRP">
        </label>
        <button type="button" id="save-settings-btn">Save</button>
        <div id="settings-result"></div>
      </div>
    </details>
  </section>

  <section id="holdings-section">
    <h2>Holdings</h2>
    <div id="holdings-empty" class="empty-state" hidden>No holdings yet — import a transaction file above to get started.</div>
    <div id="holdings-list"></div>
  </section>
</main>

<template id="holding-template">
  <div class="card holding-card">
    <div class="holding-header">
      <div class="symbol"></div>
      <div class="quantity"></div>
    </div>
    <div class="holding-stats">
      <div class="stat"><span class="label">Avg. cost</span><span class="value avg-cost"></span></div>
      <div class="stat"><span class="label">Current price</span><span class="value current-price"></span></div>
      <div class="stat"><span class="label">Invested</span><span class="value total-cost"></span></div>
      <div class="stat"><span class="label">Unrealized P/L</span><span class="value unrealized-pl"></span></div>
    </div>

    <details class="calculator">
      <summary>Target-average calculator</summary>
      <div class="calc-body">
        <label>
          Target average (EUR)
          <input type="number" step="any" class="calc-target" placeholder="e.g. 25000">
        </label>
        <label>
          Hypothetical buy price (EUR)
          <input type="number" step="any" class="calc-price" placeholder="e.g. 20000">
        </label>
        <div class="calc-result"></div>
      </div>
    </details>

    <details class="manual-adjust">
      <summary>Add manual adjustment</summary>
      <div class="manual-body">
        <p class="hint">For anything that didn't come from an exchange import - e.g. an unexplained wallet balance.
          Leave EUR cost blank if you don't know it (recorded as unknown, not guessed).</p>
        <label>
          Type
          <select class="manual-type">
            <option value="buy">Add to holdings (buy/received)</option>
            <option value="sell">Remove from holdings (sell/sent)</option>
          </select>
        </label>
        <label>
          Quantity
          <input type="number" step="any" class="manual-quantity" placeholder="e.g. 5.5">
        </label>
        <label>
          EUR cost (optional - leave blank if unknown)
          <input type="number" step="any" class="manual-price" placeholder="e.g. 20 (per unit)">
        </label>
        <label>
          Date (optional - defaults to now)
          <input type="date" class="manual-date">
        </label>
        <label class="notes-label">
          Notes
          <input type="text" class="manual-notes" placeholder="e.g. unexplained wallet discrepancy">
        </label>
        <button type="button" class="manual-submit-btn">Add</button>
        <div class="manual-result"></div>
      </div>
    </details>

    <details class="tx-history">
      <summary>Transaction history</summary>
      <div class="tx-list"></div>
    </details>
  </div>
</template>

<template id="tx-row-template">
  <div class="tx-row">
    <span class="tx-date"></span>
    <span class="tx-type"></span>
    <span class="tx-qty"></span>
    <span class="tx-price"></span>
    <span class="tx-total"></span>
    <span class="tx-exchange"></span>
    <span class="tx-notes"></span>
    <button type="button" class="tx-delete" title="Delete this transaction">&times;</button>
  </div>
</template>

<script src="/static/app.js"></script>
</body>
</html>
